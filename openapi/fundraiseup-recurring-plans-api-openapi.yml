      - name
    EmbeddedSupporterResponse:
      type: object
      properties:
        address:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/AddressResponse'
        email:
          type:
          - string
          - 'null'
          description: Supporter's email address.
          example: example@example.com
        employer:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/EmployerResponse'
        employment_status:
          type:
          - string
          - 'null'
          description: 'The supporter''s employment status at the time of the donation. Possible values: `employed`, `unemployed`, `retired`. Returns `null` if not collected. Only collected for US political organizations.'
          enum:
          - employed
          - unemployed
          - retired
          example: employed
        first_name:
          type:
          - string
          - 'null'
          description: Supporter's first name.
          example: Alex
        id:
          type: string
          description: Unique supporter identifier.
          example: SXXXXXXXX
        language:
          type: string
          enum:
          - en-US
          - en-GB
          - en-CA
          - fr-CA
          - fr-FR
          - es
          - nl
          - 'no'
          - de
          - de-x-informal
          - fi-FI
          - ar-001
          - sv
          - it
          - pt-PT
          - pt-BR
          - zh-CN
          - zh-TW
          - ja
          - ko
          - hu
          - da
          - ru-RU
          - es-US
          - pl-PL
          - he
          description: Supporter's locale.
          example: en-CA
        last_name:
          type:
          - string
          - 'null'
          description: Supporter's last name.
          example: Garcia
        occupation:
          type:
          - string
          - 'null'
          description: The supporter's occupation at the time of the donation. Returns `null` if not collected or if employment status is `unemployed` or `retired`. Max 200 characters.
          example: Software Engineer
        phone:
          type:
          - string
          - 'null'
          description: Supporter's phone number.
          example: +1 (111) 111111
        title:
          type:
          - string
          - 'null'
          description: Supporter's title. For organizations in Germany and Austria, any value up to 100 characters. Returns `null` if empty.
          example: mr
      description: Represents the supporter data as displayed on the Donation page in your Dashboard.
      required:
      - id
      - email
      - first_name
      - last_name
      - title
      - phone
      - employer
      - employment_status
      - occupation
      - address
      - language
