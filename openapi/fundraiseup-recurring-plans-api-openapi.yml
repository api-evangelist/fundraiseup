openapi: 3.2.0
info:
  title: Fundraise Up Recurring plans API
  description: '1. Overview

    2. Limitations

    3. Key features

    4. Use cases

    5. How to get API key

    6. Managing API keys

    7. Authentication

    8. Parent accounts and subaccounts

    9. Rate limits

    10. Errors

    11. Pagination

    12. Request IDs

    13. Changes in API


    ## Overview


    The Fundraise Up API gives you more control over your fundraising data. Use it to process offline donations through your Fundraise Up account and keep your CRM or other systems up to date with your fundraising activity. With the API, you can interact with these resources:


    - Donations — Create and update donations and their associated recurring plans (within 24 hours of creation, API-created only). - Recurring plans — Read recurring donation schedules. - Supporters — Access supporter details. - Events — Retrieve events from your Audit Log. - Donor Portal access links — Authenticate supporters in the Donor Portal. - Donor Portal recurring plan access links — Provide direct access to recurring plan settings. - Campaigns — List and retrieve campaign details, assign and unassign designations. - Designations — Create, update, delete, and list designations, including batch operations. - Designation groups — List and retrieve designation groups, assign and unassign designations. - Designation configurations — Access relationships between designations and campaigns. - Upgrade links — Generate upgrade links for one-time donations to convert them into recurring plans. ## Limitations


    - Most endpoints operate on a single object per request. Designation endpoints support batch operations for up to 100 items. - Updates to Donations and Recurring plans are restricted to the first 24 hours and apply only to API-created donations. - You can retrieve and export data only for Donations, Recurring plans, Supporters, Events, Campaigns, Designations, Designation groups, and Designation configurations. - The API supports the following payment methods: credit cards, debit cards, Apple Pay, Google Pay, ACH US Direct Debit, BACS Direct Debit, and PAD (Canadian Pre-Authorized Debit). - For ACH US Direct Debit, BACS Direct Debit, and PAD (Canadian Pre-Authorized Debit) donations, Fundraise Up sends the mandate confirmation email to the supporter only when `supporter.email` is provided. Without an email, notifying the supporter about the direct debit mandate is the organization''s responsibility. ## Key features


    - Architecture — Built on REST principles. - URLs — Provides predictable, resource-oriented URLs. - Requests — Accepts JSON-encoded request bodies with `Content-Type: application/json` header. - Responses — Returns JSON-encoded responses. - Standards — Uses standard HTTP response codes, authentication, and verbs. ## Use cases


    There are a variety of use cases where you can integrate our API into your fundraising flow. In particular, you can use our API for:


    - Ticketing and events. - Face-to-face fundraising. - Direct mail campaigns. - Telefundraising. - Fundraising galas and dinners. - Analytics integrations. The API is not intended for migrating subscriptions from legacy systems. For migration purposes, please refer to our Migration service. ## How to get API key


    To use the Fundraise Up API, you first need to generate an API key. Only users with the Organization Administrator role can create and manage API keys. Follow these steps to create your API key:


    1. Go to **Dashboard** > **Settings** > **API keys**. 2. Click **Create API key**. 3. Enter a descriptive name for your API key. This name helps you identify different keys when you have multiple integrations. 4. Set permissions for your key.'
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Recurring plans
  description: The Recurring Plan object represents a single recurring donation plan. It includes supporter data, which is displayed as it appears on the Recurring Plan page in your Dashboard.
paths:
  /v1/recurring_plans:
    get:
      description: This request allows you to read your Fundraise Up recurring plan records. The supporter data will be displayed as it appears on the Recurring plan page in your Dashboard.
      operationId: GetRecurringPlans
      parameters:
      - name: livemode
        required: false
        in: query
        description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026.
        schema:
          example: true
          type: boolean
      - name: starting_after
        required: false
        in: query
        description: A cursor for pagination. Returns records older than the specified object ID.
        schema:
          type: string
      - name: ending_before
        required: false
        in: query
        description: A cursor for pagination. Returns records newer than the specified object ID.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: This parameter specifies the number of records to display per page, ranging from 1 to 100
        schema:
          minimum: 1
          maximum: 100
          default: 10
          type: integer
      - name: created
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/CreatedQuery'
      responses:
        '200':
          description: On success, the API returns the list of recurring plans. The response includes the recurring plan data array and a boolean indicating if more records are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPlansResponse'
        '403':
          description: Forbidden. The API key does not have permission to access recurring plans.
      security:
      - bearer: []
      summary: Get recurring plans
      tags:
      - Recurring plans
  /v1/recurring_plans/{id}:
    get:
      description: This request allows you to read your Fundraise Up recurring plan record. The supporter data will be displayed as it appears on the Recurring plan page in your Dashboard.
      operationId: GetRecurringPlan
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the recurring plan, formatted as R[A-Z]{7}.
        schema:
          example: RXXXXXXX
          type: string
      - name: livemode
        required: false
        in: query
        description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026.
        schema:
          example: true
          type: boolean
      responses:
        '200':
          description: On success, the API returns the recurring plan object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPlanResponse'
        '403':
          description: Forbidden. The API key does not have permission to access recurring plans.
      security:
      - bearer: []
      summary: Get a recurring plan
      tags:
      - Recurring plans
components:
  schemas:
    IpResponse:
      type: object
      properties:
        address:
          type:
          - string
          - 'null'
          description: IP address.
          example: 111.111.111.111
        city:
          type:
          - string
          - 'null'
          description: City name.
          example: Nashville
        country_name:
          type:
          - string
          - 'null'
          description: Full country name.
          example: United States
        region:
          type:
          - string
          - 'null'
          description: Region name.
          example: Tennessee
      description: Contains details about the IP address from which the donation was made.
      required:
      - address
      - country_name
      - region
      - city
    UtmResponse:
      type: object
      properties:
        campaign:
          type:
          - string
          - 'null'
          description: The `utm_campaign` value, if available. Shows the name of the marketing campaign.
          example: giving_tuesday
        content:
          type:
          - string
          - 'null'
          description: The `utm_content` value, if available. Identifies which link or ad variation was clicked.
          example: textlink
        medium:
          type:
          - string
          - 'null'
          description: The `utm_medium` value, if available. Shows the type of marketing channel.
          example: email
        source:
          type:
          - string
          - 'null'
          description: The `utm_source` value, if available. Shows where the traffic came from.
          example: google
        term:
          type:
          - string
          - 'null'
          description: The `utm_term` value, if available. Shows the keywords used in a search.
          example: how_to_support_penguins
      description: Represents UTM tags associated with the donation.
      required:
      - source
      - campaign
      - content
      - medium
      - term
    RecurringPlansResponse:
      type: object
      properties:
        data:
          description: An array containing the entity records, paginated by any request parameters.
          type: array
          items:
            $ref: '#/components/schemas/RecurringPlanResponse'
        has_more:
          type: boolean
          description: Indicates whether there are more records available. For `starting_after`, it shows that there is a page with older records. For `ending_before`, it indicates that there is a page with newer records.
          example: true
      description: Provides a response for recurring plans.
      required:
      - data
      - has_more
    ElementResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique element identifier.
          example: XXXXXXXX
        name:
          type: string
          description: Name of the element.
          example: My Element
        type:
          type: string
          description: Type of element used for the donation.
          example: donationForm
          enum:
          - reminder
          - donateButton
          - stickyButton
          - imageCard
          - textLink
          - donationForm
          - simpleForm
          - goalMeter
          - statCounter
          - impactSlider
          - donationLevels
          - buttonGroup
          - floatingButton
          - messageBar
          - topSupporters
          - topLocations
          - socialProof
          - qrCode
          - recentDonations
          - p2pButton
          - p2pLink
          - p2pFundraisingButton
          - p2pFundraisingLink
          - topFundraisers
          - donorMap
          - lightbox
          - zakatAlMalCalculator
          - zakatAlFitrCalculator
          - fidiyahKaffarahCalculator
          - p2pFundraiserGallery
          - p2pTopFundraisers
          - fundraisingPageLink
          - fundraisingPageInviteLink
          - link
          - direct
          - debugPanel
          - testModePanel
          - aiAssistant
          - splitTesting
          - jsApi
      description: Represents the element through which the donation was made.
      required:
      - id
      - type
      - name
    TributeRecipientResponse:
      type: object
      properties:
        address:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/RecipientAddressResponse'
        email:
          type:
          - string
          - 'null'
          description: Email address used for `email` sharing type.
          example: example@example.com
        first_name:
          type:
          - string
          - 'null'
          description: Tribute recipient's first name.
          example: Sidney
        last_name:
          type:
          - string
          - 'null'
          description: Tribute recipient's last name.
          example: Jones
        title:
          type:
          - string
          - 'null'
          description: Tribute recipient's title.
          example: mr
      description: Contains details about the tribute recipient.
      required:
      - title
      - first_name
      - last_name
      - email
      - address
    CampaignResponse:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Campaign code, as set in the Dashboard.
          example: Code-1
        id:
          type: string
          description: Unique campaign identifier.
          example: FUNXXXXXXXX
        name:
          type: string
          description: Campaign name.
          example: My Campaign
      description: Provides details about the campaign.
      required:
      - id
      - code
      - name
    CreatedQuery:
      type: object
      properties:
        created[gt]:
          type: string
          format: date-time
          description: Minimum creation date (exclusive). Returns records after this timestamp.
          example: '2025-01-01T12:30:00+02:00'
        created[gte]:
          type: string
          format: date-time
          description: Minimum creation date (inclusive). Returns records from and after this timestamp.
          example: '2025-01-01T12:30:00+02:00'
        created[lt]:
          type: string
          format: date-time
          description: Maximum creation date (exclusive). Returns records before this timestamp.
          example: '2025-01-01T12:30:00+02:00'
        created[lte]:
          type: string
          format: date-time
          description: Maximum creation date (inclusive). Returns records up to and including this timestamp.
          example: '2025-01-01T12:30:00+02:00'
      description: Filters results by the record creation date. Accepts a single date or a date range in RFC 3339 format.
    CustomFieldResponse:
      type: object
      properties:
        name:
          type: string
          description: Name of the custom field.
          example: Field1
        value:
          type: string
          description: Value of the custom field.
          example: Value1
      description: 'Represents custom fields populated according to the campaign settings.


        Missing fields will be populated with default non-blank values from the campaign settings.'
      required:
      - name
      - value
    BankAccountResponse:
      type: object
      properties:
        last4:
          type:
          - string
          - 'null'
          description: Last four digits of the bank account number.
          example: '1234'
      description: Contains information about the bank account used for the payment.
      required:
      - last4
    AddressResponse:
      type: object
      properties:
        city:
          type:
          - string
          - 'null'
          description: City name
          example: Nashville
        country:
          type: string
          description: '[Two-letter country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2), in lowercase.'
          example: us
        line1:
          type:
          - string
          - 'null'
          description: First address line.
          example: 123 Example St.
        line2:
          type:
          - string
          - 'null'
          description: Second address line.
          example: Apt. 1
        postal_code:
          type:
          - string
          - 'null'
          description: Postal or ZIP code.
          example: '111111'
        region:
          type:
          - string
          - 'null'
          description: Can refer to a region, state, or province.
          example: Tennessee
      description: Contains the mailing address details.
      required:
      - country
      - city
      - postal_code
      - region
      - line1
      - line2
    CommunicationConsentResponse:
      type: object
      properties:
        customized:
          $ref: '#/components/schemas/CustomizedCommunicationConsentResponse'
        general:
          type: string
          description: 'Indicates overall communication consent.


            `opted_in` if the supporter agreed to receive communications.


            `opted_out` if the supporter declined communications.


            `not_submitted` if no consent data is available.'
          enum:
          - not_submitted
          - opted_in
          - opted_out
          example: opted_in
      description: Stores the supporter's [communication consent type](https://fundraiseup.com/docs/marketing-consent/) associated with a donation.
    TributeSharingResponse:
      type: object
      properties:
        from:
          type:
          - string
          - 'null'
          description: Name of the sender.
          example: Alex Garcia
        hide_amount:
          type: boolean
          description: Indicates whether the donation amount should be hidden in the tribute notification sent to the recipient.
          example: false
        message:
          type:
          - string
          - 'null'
          description: Custom message included in the tribute.
          example: In loving memory of Jordan
        recipient:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/TributeRecipientResponse'
        type:
          type:
          - string
          - 'null'
          enum:
          - email
          - address
          description: Sharing method.
          example: email
      description: Defines the sharing options for a tribute.
      required:
      - type
      - from
      - message
      - recipient
      - hide_amount
    AccountResponse:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Custom identifier for the organization, set as the Account code in the Fundraise Up account.
          example: Code-1
        id:
          type: string
          description: Unique identifier of the organization in the format A[A-Z]{7}.
          example: AXXXXXXX
        name:
          type: string
          description: The name of the organization as set in the Fundraise Up account.
          example: Example Account
      description: Organization account information.
      required:
      - id
      - code
      - name
    QuestionResponse:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Question code, as set in the Dashboard.
          example: Code-1
        id:
          type: string
          description: Unique identifier of the question, formatted as Q[A-Z]{7}. Located in [Settings > Questions](https://dashboard.fundraiseup.com/settings/questions).
          example: QXXXXXXX
        checked:
          type: boolean
          description: Indicates whether the checkbox is selected. Required for questions with the type "Single checkbox".
          example: true
        options:
          type: array
          items:
            type: string
          description: List of selected options. Required for questions with the type "Multiple checkboxes".
          example:
          - OK
          - Good
        text:
          type: string
          description: Answer for the question. This field is returned only for question types "Text box", "Text line", "Select one option", and "Dropdown menu".
          example: Example answer
      description: 'Provides information about a question used in the donation process.


        Each item must include an `id` and, depending on the question type, one of the following fields: `text`, `options`, or `checked`.'
      required:
      - id
      - code
    EmployerResponse:
      type: object
      properties:
        name:
          type: string
          description: Employer's name.
          example: Fundraise Up Inc.
      description: Represents the employer information.
      required:
      - name
    CustomizedCommunicationConsentResponse:
      type: object
      properties:
        email:
          type: string
          description: 'Indicates email communication consent.


            `opted_in` if the supporter agreed to receive emails.


            `opted_out` if the supporter declined email communication.


            `not_submitted` if no email consent data is available.'
          enum:
          - not_submitted
          - opted_in
          - opted_out
          example: opted_in
        phone_calls:
          type: string
          description: 'Indicates phone call communication consent.


            `opted_in` if the supporter agreed to receive phone calls.


            `opted_out` if the supporter declined to receive phone calls.


            `not_submitted` if no phone call consent data is available.'
          enum:
          - not_submitted
          - opted_in
          - opted_out
          example: opted_out
        postal_mail:
          type: string
          description: 'Indicates postal mail communication consent.


            `opted_in` if the supporter agreed to receive postal mail.


            `opted_out` if the supporter declined to receive postal mail.


            `not_submitted` if no postal mail consent data is available.'
          enum:
          - not_submitted
          - opted_in
          - opted_out
          example: opted_in
        sms:
          type: string
          description: 'Indicates SMS communication consent.


            `opted_in` if the supporter agreed to receive SMS messages.


            `opted_out` if the supporter declined SMS communication.


            `not_submitted` if no SMS consent data is available.'
          enum:
          - not_submitted
          - opted_in
          - opted_out
          example: opted_in
        social_media:
          type: string
          description: 'Indicates social media communication consent.


            `opted_in` if the supporter agreed to receive messages through social media.


            `opted_out` if the supporter declined social media communication.


            `not_submitted` if no social media consent data is available.'
          enum:
          - not_submitted
          - opted_in
          - opted_out
          example: opted_out
      description: Specifies consent values for individual communication channels.
      required:
      - email
      - phone_calls
      - sms
      - postal_mail
      - social_media
    RecurringPlanResponse:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountResponse'
        amount:
          type: string
          description: Donation amount for each recurring installment, in the plan's currency.
          example: '99.99'
        amount_before_fees_covered:
          type: string
          description: Amount before fees were covered by supporter.
          example: '99.99'
        amount_before_fees_covered_in_default_currency:
          type: string
          description: Amount before fees were covered by supporter, converted to the organization's default currency at the time of the donation.
          example: '59.99'
        amount_in_default_currency:
          type: string
          description: Donation amount for each recurring installment, converted to the organization's default currency at the time of the donation.
          example: '59.99'
        anonymous:
          type: boolean
          description: Indicates if the recurring donations are made anonymously (`true`) or not (`false`).
          example: false
        benefit:
          oneOf:
          - title: BenefitNotShownResponse
            allOf:
            - $ref: '#/components/schemas/BenefitNotShownResponse'
            type: object
            description: Represents the benefit associated with a recurring plan.
          - title: BenefitShownNotSelectedResponse
            allOf:
            - $ref: '#/components/schemas/BenefitShownNotSelectedResponse'
            type: object
            description: Represents the benefit associated with a recurring plan.
          - title: BenefitSelectedResponse
            allOf:
            - $ref: '#/components/schemas/BenefitSelectedResponse'
            type: object
            description: Represents the benefit associated with a recurring plan.
          discriminator:
            propertyName: state
            mapping:
              not_shown: '#/components/schemas/BenefitNotShownResponse'
              shown_not_selected: '#/components/schemas/BenefitShownNotSelectedResponse'
              selected: '#/components/schemas/BenefitSelectedResponse'
        campaign:
          $ref: '#/components/schemas/CampaignResponse'
        cancellation_details:
          type:
          - string
          - 'null'
          description: Additional details about the cancellation provided by the supporter. Can be `null` when not provided or when the plan is not canceled.
          example: Moving to a different organization
        cancellation_reason:
          type:
          - string
          - 'null'
          enum:
          - financial_difficulty
          - life_changes
          - switched_donation_method
          - change_in_giving_preferences
          - subscription_consolidation
          - loss_of_confidence_in_organization
          - technical_error
          - created_by_mistake
          - no_clear_reason_given
          - other
          description: The reason category selected when the recurring plan was canceled. Can be `null` when no reason category was selected or when the plan is not canceled.
          example: financial_difficulty
        comment:
          type:
          - string
          - 'null'
          description: Optional comment attached to the recurring donation plan.
          example: comment example
        consent:
          $ref: '#/components/schemas/CommunicationConsentResponse'
        created_at:
          type: string
          description: Timestamp in ISO 8601 format, indicating when the recurring plan was created in UTC.
          example: '2024-12-20T00:00:00.000Z'
