          example: usd
        designation:
          type: string
          description: Designation ID.
          example: EXXXXXXX
        goal:
          $ref: '#/components/schemas/GoalPostRequest'
        image:
          $ref: '#/components/schemas/FundraiserImageRequest'
        livemode:
          type: boolean
          description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026. Fundraisers only exist in live mode — set this to `true`.
          example: true
        slug:
          type: string
          description: Unique identifier for the Fundraiser within the account or subaccount. The slug is not shared across accounts or subaccounts and must be unique within each. Can include up to 25 letters, numbers, underscores, or hyphens.
          example: 5003-000000D8cu_IQAA
        status:
          type: string
          enum:
          - active
          - paused
      description: Contains the request parameters required for creating a Fundraiser.
      required:
      - campaign
      - name
      - description
    FundraisersResponse:
      type: object
      properties:
        data:
          description: An array containing the entity records, paginated by any request parameters.
          type: array
          items:
            $ref: '#/components/schemas/GetFundraiserResponse'
        has_more:
          type: boolean
          description: Indicates whether there are more records available. For `starting_after`, it shows that there is a page with older records. For `ending_before`, it indicates that there is a page with newer records.
          example: true
      description: Provides a paginated response for fundraisers.
      required:
      - data
      - has_more
    FundraiserImageResponse:
      type: object
      properties:
        preview_url:
          type: string
          description: URL for the preview image.
      description: Image details for the Fundraiser, if available.
      required:
      - preview_url
    FundraiserGoalResponse:
      type: object
      properties:
        amount:
          type: string
          description: Target amount for the fundraiser.
        end_date:
          type: string
          description: End date for the fundraiser goal.
      description: Goal details for the Fundraiser, if set.
      required:
      - amount
      - end_date
    GoalPostRequest:
      type: object
      properties:
        amount:
          type: string
          description: 'Donation amount in the selected currency. Must be a decimal string in the format `{NNN}[.nn]`. Examples: 9.99 (for USD), 200 (for JPY).


            The amount must be greater than $10 or its equivalent in other currencies.'
          example: '99.99'
        end_date:
          type: string
          description: Date when the goal ends. Must be in YYYY-MM-DD format and set to a future date.
          example: '2025-01-01'
      description: Goal for the Fundraiser.
      required:
      - amount
      - end_date
    DesignationResponse:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Designation code.
          example: Code-1
        id:
          type: string
          description: Unique designation identifier.
          example: EXXXXXXX
        name:
          type:
          - string
          - 'null'
          description: Designation name.
          example: My Designation
      description: Contains information about the designation.
      required:
      - id
      - code
      - name
