          example: FUNXXXXXXXX
        description:
          type: string
          description: Description of the Fundraiser
          example: I'm raising money to help protect penguins and their habitat. Join me!
        name:
          type: string
          description: The title of the Fundraiser, used as its main heading.
          example: Run for hope
        code:
