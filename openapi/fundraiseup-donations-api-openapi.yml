      - line2
    ChargePaymentResponse:
      type: object
      properties:
        bank_account:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/BankAccountResponse'
        credit_card:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/CreditCardResponse'
        daf_external_id:
          type:
          - string
          - 'null'
          description: The external grant ID assigned by Chariot to the Donor-Advised Fund (DAF) grant. Returns `null` unless `payment.method` is `daf`.
          example: 010c5aa7-28f5-426f-b31f-9ba77754055f
        daf_sponsor_fund:
          type:
          - string
          - 'null'
          description: The name of the Donor-Advised Fund (DAF) sponsor organization. Returns `null` unless `payment.method` is `daf`.
          example: Fidelity Charitable
        daf_tracking_id:
          type:
          - string
          - 'null'
          description: The Chariot tracking ID of the Donor-Advised Fund (DAF) grant. Returns `null` unless `payment.method` is `daf`.
          example: 1e60800e-849b-43d1-870e-57afc8d75473
        email:
          type:
          - string
          - 'null'
          description: Email associated with the payment method.
          example: example@example.com
        error_message:
          type:
          - string
          - 'null'
          description: Most recent payment error message. Returned only if the status is `failed` or `retrying`. Otherwise, returns `null`.
          example: Something went wrong
        id:
          type:
          - string
          - 'null'
          description: 'For PayPal: Capture ID.


            For Stripe: Charge ID or Payment Intent ID.


            For other processors: payment ID.'
          example: ch_1I9nHHHUtU5Pnu8b93DuxyzE
        method:
          type: string
          enum:
          - credit_card
          - apple_pay
          - google_pay
          - click_to_pay
          - ach
          - paypal
          - venmo
          - becs_direct_debit
          - bacs_direct_debit
          - pad
          - sepa_direct_debit
          - ideal
          - crypto
          - stock
          - link
          - twint
          - mobile_pay
          - wero
          - revolut_pay
          - cash_app_pay
          - eps
          - daf
          description: 'Payment method, in lowercase underscore. `stock` is deprecated but may still appear in retrieved data.


            The value of `us_bank_account` maps to `ach`. The value of `plaid` also maps to `ach`.'
          example: paypal
        processor:
          type: string
          enum:
          - stripe
          - paypal
          - gemini
          - manual_brokerage
          - coinbase_commerce
          - chariot
          description: Payment processor, in lowercase. `coinbase_commerce` is deprecated but may still appear in retrieved data.
          example: stripe
      description: Provides details about the payment processing.
      required:
      - id
      - email
      - error_message
      - method
      - processor
      - credit_card
      - bank_account
      - daf_tracking_id
      - daf_external_id
      - daf_sponsor_fund
