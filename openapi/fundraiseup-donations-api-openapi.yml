    RecurringPostRequest:
      type: object
      properties:
        frequency:
          type: string
          description: Recurring plan frequency. Determines how often a recurring donation is processed.
          enum:
          - daily
          - weekly
          - biweekly
          - every4weeks
          - monthly
          - bimonthly
          - quarterly
          - semiannual
          - annual
          example: monthly
      description: 'Defines the parameters for a recurring donation plan.


        This must be specified if the campaign settings in the Frequency section do not include "Once" as an option for either Default Frequency or Second Frequency.'
      required:
      - frequency
    IpResponse:
      type: object
      properties:
        address:
          type:
          - string
          - 'null'
          description: IP address.
          example: 111.111.111.111
        city:
          type:
          - string
          - 'null'
          description: City name.
          example: Nashville
        country_name:
          type:
          - string
          - 'null'
          description: Full country name.
          example: United States
        region:
          type:
          - string
          - 'null'
          description: Region name.
          example: Tennessee
      description: Contains details about the IP address from which the donation was made.
      required:
      - address
      - country_name
      - region
      - city
