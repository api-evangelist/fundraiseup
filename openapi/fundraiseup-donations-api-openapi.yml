        line1:
          type:
          - string
          - 'null'
          description: First address line.
          example: 123 Example St.
        line2:
          type:
          - string
          - 'null'
          description: Second address line.
          example: Apt. 1
        postal_code:
          type:
          - string
          - 'null'
          description: Postal or ZIP code.
          example: '111111'
        region:
