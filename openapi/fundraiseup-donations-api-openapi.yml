    PaymentMethodStripePostRequest:
      type: object
      properties:
        id:
          type: string
          description: The [PaymentMethod ID](https://docs.stripe.com/api/payment_methods/object#payment_method_object-id) within the organization's Stripe account. Supported payment methods are credit cards, debit cards, Apple Pay, and Google Pay.
          example: pm_card_visa
        setup_intent_id:
          type: string
          description: The Stripe SetupIntent ID associated with the payment method. Required for ACH US Direct Debit, BACS Direct Debit, and PAD (Canadian Pre-Authorized Debit) payments. Not applicable for card-based payment methods.
          example: seti_1OsI2pHUtU5Pnu8bXXXXXXXX
      description: 'Contains information about the Stripe payment method used for the transaction.


        When writing test code, use a `payment_method.stripe.id` such as `pm_card_visa` from the list of [Stripe test cards](https://docs.stripe.com/testing?testing-method=payment-methods#cards). For more information on using test cards, see the [Stripe documentation](https://docs.stripe.com/testing?testing-method=payment-methods#use-test-cards).'
      required:
      - id
