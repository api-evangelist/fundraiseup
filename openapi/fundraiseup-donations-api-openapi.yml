openapi: 3.2.0
info:
  title: Fundraise Up Donations API
  description: '1. Overview

    2. Limitations

    3. Key features

    4. Use cases

    5. How to get API key

    6. Managing API keys

    7. Authentication

    8. Parent accounts and subaccounts

    9. Rate limits

    10. Errors

    11. Pagination

    12. Request IDs

    13. Changes in API


    ## Overview


    The Fundraise Up API gives you more control over your fundraising data. Use it to process offline donations through your Fundraise Up account and keep your CRM or other systems up to date with your fundraising activity. With the API, you can interact with these resources:


    - Donations — Create and update donations and their associated recurring plans (within 24 hours of creation, API-created only). - Recurring plans — Read recurring donation schedules. - Supporters — Access supporter details. - Events — Retrieve events from your Audit Log. - Donor Portal access links — Authenticate supporters in the Donor Portal. - Donor Portal recurring plan access links — Provide direct access to recurring plan settings. - Campaigns — List and retrieve campaign details, assign and unassign designations. - Designations — Create, update, delete, and list designations, including batch operations. - Designation groups — List and retrieve designation groups, assign and unassign designations. - Designation configurations — Access relationships between designations and campaigns. - Upgrade links — Generate upgrade links for one-time donations to convert them into recurring plans. ## Limitations


    - Most endpoints operate on a single object per request. Designation endpoints support batch operations for up to 100 items. - Updates to Donations and Recurring plans are restricted to the first 24 hours and apply only to API-created donations. - You can retrieve and export data only for Donations, Recurring plans, Supporters, Events, Campaigns, Designations, Designation groups, and Designation configurations. - The API supports the following payment methods: credit cards, debit cards, Apple Pay, Google Pay, ACH US Direct Debit, BACS Direct Debit, and PAD (Canadian Pre-Authorized Debit). - For ACH US Direct Debit, BACS Direct Debit, and PAD (Canadian Pre-Authorized Debit) donations, Fundraise Up sends the mandate confirmation email to the supporter only when `supporter.email` is provided. Without an email, notifying the supporter about the direct debit mandate is the organization''s responsibility. ## Key features


    - Architecture — Built on REST principles. - URLs — Provides predictable, resource-oriented URLs. - Requests — Accepts JSON-encoded request bodies with `Content-Type: application/json` header. - Responses — Returns JSON-encoded responses. - Standards — Uses standard HTTP response codes, authentication, and verbs. ## Use cases


    There are a variety of use cases where you can integrate our API into your fundraising flow. In particular, you can use our API for:


    - Ticketing and events. - Face-to-face fundraising. - Direct mail campaigns. - Telefundraising. - Fundraising galas and dinners. - Analytics integrations. The API is not intended for migrating subscriptions from legacy systems. For migration purposes, please refer to our Migration service. ## How to get API key


    To use the Fundraise Up API, you first need to generate an API key. Only users with the Organization Administrator role can create and manage API keys. Follow these steps to create your API key:


    1. Go to **Dashboard** > **Settings** > **API keys**. 2. Click **Create API key**. 3. Enter a descriptive name for your API key. This name helps you identify different keys when you have multiple integrations. 4. Set permissions for your key.'
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Donations
  description: 'The Donation object represents a single donation. It can be either a one-time donation or an installment as part of a recurring plan.


    You can create donations, update donations and associated recurring plans sourced from the API, and read donations from your account.'
paths:
  /v1/donations:
    post:
      description: 'This request allows you to create either a one-time donation or a recurring plan.


        To create a recurring plan, you must include a `recurring_plan` object with the `frequency` parameter. If the object is not provided, a one-time donation will be created.


        All fields and values must meet the requirements of your campaign. Otherwise, an error will be returned.


        We do not format or verify addresses and emails that were sent through the API.


        A Stripe payment method ID is required. For more details on how to create a payment method, refer to the Stripe Payment Methods documentation.


        ### Prerequisites


        Make sure you have:


        - A Stripe account that is connected to your Fundraise Up account and activated.


        - An active campaign with a money-based payment method.


        - An API key with permission to create new donations.


        - Access to the Stripe API for the same Stripe account used as the Fundraise Up payment method, with the ability to create Payment Methods.


        Nonprofit organizations must meet PCI compliance requirements to ensure the secure processing of payment card data. Fundraise Up complies with these standards, but if an organization or its vendor uses direct API integration with Stripe to send raw card data (such as card numbers, expiration dates, and CVV codes), that organization or vendor is responsible for meeting broader PCI DSS requirements, such as SAQ D for merchants or higher.


        When using Stripe Elements, organizations remain responsible for PCI compliance, but the scope is reduced, typically to SAQ A, due to Stripe handling sensitive card data processing. If a third-party vendor manages card details (for example, in face-to-face or direct mail solutions), they must maintain their own PCI compliance (SAQ D or applicable), and the organization should document them as their third-party service provider.'
      operationId: CreateDonation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDonationRequest'
      responses:
        '200':
          description: On success, the API returns the donation object. If the parameters are invalid, the call will return an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '403':
          description: Forbidden. The API key does not have permission to access donations.
        '422':
          description: '`employment_status is required for political organizations` — The account has Political Organization (US) enabled, but `employment_status` was not provided.

            `occupation is required when employment status is employed` — Employment status is `employed`, but `occupation` was not provided.

            `employer is required when employment status is employed` — Employment status is `employed`, but `employer` was not provided.'
      security:
      - bearer: []
      summary: Create a donation
      tags:
      - Donations
    get:
      description: 'This request lets you access donation records in your Fundraise Up account. Note that we do not support webhooks.


        The supporter data will be displayed as it appears on the Donation page in your Dashboard.'
      operationId: GetDonations
      parameters:
      - name: livemode
        required: false
        in: query
        description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026.
        schema:
          example: true
          type: boolean
      - name: starting_after
        required: false
        in: query
        description: A cursor for pagination. Returns records older than the specified object ID.
        schema:
          type: string
      - name: ending_before
        required: false
        in: query
        description: A cursor for pagination. Returns records newer than the specified object ID.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: This parameter specifies the number of records to display per page, ranging from 1 to 100
        schema:
          minimum: 1
          maximum: 100
          default: 10
          type: integer
      - name: created
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/CreatedQuery'
      - name: include
        required: false
        in: query
        description: 'Comma-separated list of additional fields to include in the response. Supported values: upgrade_link.'
        schema:
          type: string
          enum:
          - upgrade_link
      responses:
        '200':
          description: On success, the API returns the array of donation objects. If the parameters are invalid, the call will return an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationsResponse'
        '403':
          description: Forbidden. The API key does not have permission to access donations.
      security:
      - bearer: []
      summary: Get donations
      tags:
      - Donations
  /v1/donations/{id}:
    post:
      description: 'This request allows you to update the details of a donation that was made through an API call.


        You can make updates to:


        * Enrich data.

        * Modify parameter values.

        * Remove parameter values.


        This action is only available within 24 hours of the donation being created.


        Donations created outside of the API, such as through the Checkout modal, Campaign Page, or Virtual Terminal, cannot be edited through the API.


        The donation ID must belong to the account associated with the API key.


        Donations from subaccounts cannot be updated using the API key of the parent account. Attempting to do so will result in an error. To update a donation in a subaccount, you must use the API key of that subaccount.


        For the update to be successful, the donation object must match the current campaign settings, otherwise the operation will fail with a validation error.


        Parallel requests to update one object are not allowed and will result in an error.


        Any parameters or child parameters that are not provided will remain unchanged.


        A successful update will modify the donation receipt, but no emails will be sent as a result.


        If you update recurring plan, the changes will apply to both the specific installment and all future installments.'
      operationId: UpdateDonation
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the donation, formatted as D[A-Z]{7}.
        schema:
          example: DXXXXXXX
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDonationRequest'
      responses:
        '200':
          description: On success, the API returns the donation object. If the parameters are invalid, the call will return an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '403':
          description: Forbidden. The API key does not have permission to update donations.
        '422':
          description: '`employment_status is required for political organizations` — The account has Political Organization (US) enabled, but `employment_status` was not provided.

            `occupation is required when employment status is employed` — Employment status is `employed`, but `occupation` was not provided.

            `employer is required when employment status is employed` — Employment status is `employed`, but `employer` was not provided.'
      security:
      - bearer: []
      summary: Update a donation and its associated recurring plan
      tags:
      - Donations
    get:
      description: 'This request lets you access donation records in your Fundraise Up account. Note that we do not support webhooks.


        The supporter data will be displayed as it appears on the Donation page in your Dashboard.'
      operationId: GetDonation
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the donation, formatted as D[A-Z]{7}.
        schema:
          example: DXXXXXXX
          type: string
      - name: livemode
        required: false
        in: query
        description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026.
        schema:
          example: true
          type: boolean
      - name: include
        required: false
        in: query
        description: 'Comma-separated list of additional fields to include in the response. Supported values: upgrade_link.'
        schema:
          type: string
          enum:
          - upgrade_link
      responses:
        '200':
          description: On success, the API returns the donation object. If the parameters are invalid, the call will return an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '403':
          description: Forbidden. The API key does not have permission to access donations.
      security:
      - bearer: []
      summary: Get a donation
      tags:
      - Donations
  /v1/donations/fee:
    get:
      description: 'This endpoint calculates the processing fee for a given donation amount and currency. Fee amounts vary by organization, so always use this endpoint to get the exact values — don''t calculate the fee independently.

        This endpoint requires the same API key scope as creating a donation (Donations — Write).'
      operationId: GetDonationFee
      parameters:
      - name: livemode
        required: false
        in: query
        description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026.
        schema:
