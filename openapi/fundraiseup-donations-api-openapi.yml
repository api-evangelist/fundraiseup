            description: Represents the benefit associated with a donation. The fields returned depend on `state`. For `not_shown` and `shown_not_selected`, `state` is the only field. For `selected`, the response also returns the details of the benefit the supporter chose, including its code and fair market value.
          - title: BenefitShownNotSelectedResponse
            allOf:
            - $ref: '#/components/schemas/BenefitShownNotSelectedResponse'
            type: object
            description: Represents the benefit associated with a donation. The fields returned depend on `state`. For `not_shown` and `shown_not_selected`, `state` is the only field. For `selected`, the response also returns the details of the benefit the supporter chose, including its code and fair market value.
          - title: BenefitSelectedResponse
            allOf:
            - $ref: '#/components/schemas/BenefitSelectedResponse'
            type: object
            description: Represents the benefit associated with a donation. The fields returned depend on `state`. For `not_shown` and `shown_not_selected`, `state` is the only field. For `selected`, the response also returns the details of the benefit the supporter chose, including its code and fair market value.
          discriminator:
            propertyName: state
            mapping:
              not_shown: '#/components/schemas/BenefitNotShownResponse'
              shown_not_selected: '#/components/schemas/BenefitShownNotSelectedResponse'
              selected: '#/components/schemas/BenefitSelectedResponse'
