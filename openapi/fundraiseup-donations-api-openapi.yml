    SupporterAddressPostRequest:
      type: object
      properties:
        city:
          type: string
          description: Supporter's city. Maximum 64 characters.
          example: Nashville
        line1:
          type:
          - string
          - 'null'
          description: The first line of the supporter's mailing address, typically including the street address. Maximum 256 characters.
          example: 123 Main St
        postal_code:
          type: string
          description: Supporter's postal code. Maximum 10 characters.
          example: '111111'
        country:
          type: string
          description: '[Two-letter country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2), lowercase.'
          example: us
        line2:
          type:
          - string
          - 'null'
          description: The second line of the supporter's mailing address, typically including the street address. Maximum 256 characters.
          example: Apt 1
        region:
          type:
          - string
          - 'null'
          description: 'Region, state, or province exactly as provided in the API request. Values are not normalized or validated.


            For donations created through checkout, location data uses ISO-3166 formats. If you want API-created donations to match checkout formatting, send regions using the same standard — for example, US states as two-letter codes (CA, NY).'
          example: TN
      description: 'Represents the mailing address of the supporter.


        This field is required if the campaign requires a mailing address, based on the "Ask for mailing address" setting and the minimum amount that triggers the request.'
      required:
