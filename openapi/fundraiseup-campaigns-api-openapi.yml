          - paxg
          - zec
          description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
          example: usd
        designation_mode:
          type: string
          enum:
          - select
          - assign
          description: Designation selection mode.
          example: select
        designations:
          type: array
          description: Ordered list of designations and designation groups assigned to this campaign. Polymorphic array discriminated by `type` field.
          items:
            oneOf:
            - $ref: '#/components/schemas/CampaignDesignation'
            - $ref: '#/components/schemas/CampaignDesignationGroup'
            discriminator:
              propertyName: type
              mapping:
                designation: '#/components/schemas/CampaignDesignation'
                designation_group: '#/components/schemas/CampaignDesignationGroup'
        end_date:
          type:
          - string
          - 'null'
          description: Timestamp in ISO 8601 format, indicating when the campaign ends in UTC. `null` if no end date is set.
          example: '2026-12-31T00:00:00.000Z'
        frequencies:
          description: Active donation frequencies for the campaign.
          type: array
          items:
            $ref: '#/components/schemas/CampaignFrequencyResponse'
        id:
          type: string
          description: Unique campaign identifier.
          example: FUNXXXXXXXX
        name:
          type: string
          description: Campaign name.
          example: My Campaign
        status:
          type: string
          enum:
          - active
          - disabled
          - auto_archive
          description: 'Current status of the campaign: `active` — the campaign accepts donations, `auto_archive` — the campaign is active and will be archived automatically on `end_date`, `disabled` — the campaign is turned off.'
          example: active
        tags:
          description: Campaign tags, as set in the Dashboard.
          example:
          - annual
          - general
          type: array
          items:
            type: string
      description: Contains campaign record with full details.
      required:
      - id
      - account
      - code
      - name
      - status
      - end_date
      - tags
      - currency
      - frequencies
      - designation_mode
      - designations
      - campaign_page_url
    UnassignDesignationResultItem:
      type: object
      properties:
        error:
          description: Error object. `null` on success.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/UnassignDesignationError'
        id:
          type: string
          description: Unique identifier of the designation, formatted as E[A-Z\d]{7}.
          example: EXXXXXXX
      description: Provides the result of detaching a single designation within a batch request.
      required:
      - id
      - error
    CampaignDesignation:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Designation code.
          example: GEN-01
        frequencies:
          type: array
          description: Donation frequencies accepted for this designation in this campaign.
          example:
          - once
          - monthly
          items:
            type: string
            enum:
            - once
            - daily
            - weekly
            - biweekly
            - every4weeks
            - monthly
            - bimonthly
            - quarterly
            - semiannual
            - annual
        id:
          type: string
          description: Unique designation identifier.
          example: EXXXXXXX
        is_default:
          type: boolean
          description: Indicates whether this is the pre-selected default designation in this campaign.
          example: true
        name:
          type: string
          description: Designation name.
          example: General Fund
        type:
          type: string
          enum:
          - designation
          description: Item type discriminator.
          example: designation
      description: A designation assigned to the campaign.
      required:
      - type
      - id
      - name
      - code
      - frequencies
      - is_default
    AssignDesignationsRequest:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 100
          description: An array of designations to assign.
          type: array
          items:
            $ref: '#/components/schemas/AssignDesignationItem'
        livemode:
          type: boolean
          description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026.
          example: true
      description: Contains the request parameters required for assigning designations to a campaign.
      required:
      - items
    UnassignDesignationItem:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the designation, formatted as E[A-Z\d]{7}.
          example: EXXXXXXX
      description: Contains the parameters for a single designation to detach from a campaign.
      required:
      - id
    AssignDesignationItem:
      type: object
      properties:
        frequencies:
          type: array
          description: Donation frequencies to assign this designation to.
          example:
          - once
          - monthly
          items:
            type: string
            enum:
            - once
            - daily
            - weekly
            - biweekly
            - every4weeks
            - monthly
            - bimonthly
            - quarterly
            - semiannual
            - annual
        id:
          type: string
          description: Unique identifier of the designation, formatted as E[A-Z\d]{7}.
          example: EXXXXXXX
      description: Contains the parameters for a single designation to assign to a campaign.
      required:
      - id
      - frequencies
    CampaignFrequencyResponse:
      type: object
      properties:
        minimum_amount:
          type: string
          description: Minimum donation amount in the campaign currency.
          example: '5.00'
        type:
          type: string
          enum:
          - once
          - daily
          - weekly
          - biweekly
          - every4weeks
          - monthly
          - bimonthly
          - quarterly
          - semiannual
          - annual
          description: Frequency.
          example: monthly
      description: Frequency configuration for the campaign.
      required:
      - type
      - minimum_amount
    AssignDesignationResultItem:
      type: object
      properties:
        error:
          description: Error object. `null` on success.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/AssignDesignationError'
        frequencies:
          type: array
          description: Donation frequencies from the request.
          example:
          - once
          - monthly
          items:
            type: string
            enum:
            - once
            - daily
            - weekly
            - biweekly
            - every4weeks
            - monthly
            - bimonthly
            - quarterly
            - semiannual
            - annual
        id:
          type: string
          description: Unique identifier of the designation, formatted as E[A-Z\d]{7}.
          example: EXXXXXXX
      description: Provides the result of assigning a single designation within a batch request.
      required:
      - id
      - frequencies
      - error
    AccountResponse:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Custom identifier for the organization, set as the Account code in the Fundraise Up account.
          example: Code-1
        id:
          type: string
          description: Unique identifier of the organization in the format A[A-Z]{7}.
          example: AXXXXXXX
        name:
          type: string
          description: The name of the organization as set in the Fundraise Up account.
          example: Example Account
      description: Organization account information.
      required:
      - id
      - code
      - name
    CreatedQuery:
      type: object
      properties:
        created[gt]:
          type: string
          format: date-time
          description: Minimum creation date (exclusive). Returns records after this timestamp.
          example: '2025-01-01T12:30:00+02:00'
        created[gte]:
          type: string
          format: date-time
          description: Minimum creation date (inclusive). Returns records from and after this timestamp.
          example: '2025-01-01T12:30:00+02:00'
        created[lt]:
          type: string
          format: date-time
          description: Maximum creation date (exclusive). Returns records before this timestamp.
          example: '2025-01-01T12:30:00+02:00'
        created[lte]:
          type: string
          format: date-time
          description: Maximum creation date (inclusive). Returns records up to and including this timestamp.
          example: '2025-01-01T12:30:00+02:00'
      description: Filters results by the record creation date. Accepts a single date or a date range in RFC 3339 format.
    AssignDesignationsResponse:
      type: object
      properties:
        results:
          description: An array containing the result for each item in the request, in the same order.
          type: array
          items:
            $ref: '#/components/schemas/AssignDesignationResultItem'
        status:
          type: string
          enum:
          - complete
          - partial
          - failed
          description: Status of the bulk operation.
          example: complete
      description: Provides the per-item results of a batch designation assignment request.
      required:
      - status
      - results
    CampaignDesignationGroup:
      type: object
      properties:
        children:
          type: array
          description: Designations or nested designation groups.
          items:
            oneOf:
            - $ref: '#/components/schemas/CampaignDesignation'
            - $ref: '#/components/schemas/CampaignDesignationGroup'
            discriminator:
              propertyName: type
              mapping:
                designation: '#/components/schemas/CampaignDesignation'
                designation_group: '#/components/schemas/CampaignDesignationGroup'
        id:
          type: string
          description: Unique designation group identifier.
          example: LXXXXXXX
        name:
          type: string
          description: Designation group name.
          example: Education Programs
        type:
          type: string
          enum:
          - designation_group
          description: Item type discriminator.
          example: designation_group
      description: A designation group assigned to the campaign.
      required:
      - type
      - id
      - name
      - children
    UnassignDesignationError:
      type: object
      properties:
        code:
          type: string
          enum:
          - designation_not_found
          - designation_not_attached
          description: Error code.
          example: designation_not_attached
        message:
          type: string
          description: Error message.
          example: Designation is not attached to this campaign.
      description: Describes the error that prevented detaching a single designation.
      required:
      - code
      - message
    UnassignDesignationsResponse:
      type: object
      properties:
        results:
          description: An array containing the result for each item in the request, in the same order.
          type: array
          items:
            $ref: '#/components/schemas/UnassignDesignationResultItem'
        status:
          type: string
          enum:
          - complete
          - partial
          - failed
          description: Status of the bulk operation.
          example: complete
      description: Provides the per-item results of a batch designation detachment request.
      required:
      - status
      - results
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: API key
      type: http
