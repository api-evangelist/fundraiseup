openapi: 3.2.0
info:
  title: Fundraise Up Campaigns API
  description: '1. Overview

    2. Limitations

    3. Key features

    4. Use cases

    5. How to get API key

    6. Managing API keys

    7. Authentication

    8. Parent accounts and subaccounts

    9. Rate limits

    10. Errors

    11. Pagination

    12. Request IDs

    13. Changes in API


    ## Overview


    The Fundraise Up API gives you more control over your fundraising data. Use it to process offline donations through your Fundraise Up account and keep your CRM or other systems up to date with your fundraising activity. With the API, you can interact with these resources:


    - Donations — Create and update donations and their associated recurring plans (within 24 hours of creation, API-created only). - Recurring plans — Read recurring donation schedules. - Supporters — Access supporter details. - Events — Retrieve events from your Audit Log. - Donor Portal access links — Authenticate supporters in the Donor Portal. - Donor Portal recurring plan access links — Provide direct access to recurring plan settings. - Campaigns — List and retrieve campaign details, assign and unassign designations. - Designations — Create, update, delete, and list designations, including batch operations. - Designation groups — List and retrieve designation groups, assign and unassign designations. - Designation configurations — Access relationships between designations and campaigns. - Upgrade links — Generate upgrade links for one-time donations to convert them into recurring plans. ## Limitations


    - Most endpoints operate on a single object per request. Designation endpoints support batch operations for up to 100 items. - Updates to Donations and Recurring plans are restricted to the first 24 hours and apply only to API-created donations. - You can retrieve and export data only for Donations, Recurring plans, Supporters, Events, Campaigns, Designations, Designation groups, and Designation configurations. - The API supports the following payment methods: credit cards, debit cards, Apple Pay, Google Pay, ACH US Direct Debit, BACS Direct Debit, and PAD (Canadian Pre-Authorized Debit). - For ACH US Direct Debit, BACS Direct Debit, and PAD (Canadian Pre-Authorized Debit) donations, Fundraise Up sends the mandate confirmation email to the supporter only when `supporter.email` is provided. Without an email, notifying the supporter about the direct debit mandate is the organization''s responsibility. ## Key features


    - Architecture — Built on REST principles. - URLs — Provides predictable, resource-oriented URLs. - Requests — Accepts JSON-encoded request bodies with `Content-Type: application/json` header. - Responses — Returns JSON-encoded responses. - Standards — Uses standard HTTP response codes, authentication, and verbs. ## Use cases


    There are a variety of use cases where you can integrate our API into your fundraising flow. In particular, you can use our API for:


    - Ticketing and events. - Face-to-face fundraising. - Direct mail campaigns. - Telefundraising. - Fundraising galas and dinners. - Analytics integrations. The API is not intended for migrating subscriptions from legacy systems. For migration purposes, please refer to our Migration service. ## How to get API key


    To use the Fundraise Up API, you first need to generate an API key. Only users with the Organization Administrator role can create and manage API keys. Follow these steps to create your API key:


    1. Go to **Dashboard** > **Settings** > **API keys**. 2. Click **Create API key**. 3. Enter a descriptive name for your API key. This name helps you identify different keys when you have multiple integrations. 4. Set permissions for your key.'
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Campaigns
  description: The Campaign object represents a fundraising campaign. Every donation connects to a campaign. It includes settings such as enabled donation frequencies, designation mode, and status.
paths:
  /v1/campaigns:
    get:
      description: This request allows you to read your Fundraise Up campaign records. Only base campaign types are supported.
      operationId: GetCampaigns
      parameters:
      - name: livemode
        required: false
        in: query
        description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026. Campaigns only exist in live mode — set this to `true`.
        schema:
          example: true
          type: boolean
      - name: created
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/CreatedQuery'
      - name: starting_after
        required: false
        in: query
        description: A cursor for pagination. Returns records older than the specified object ID.
        schema:
          type: string
      - name: ending_before
        required: false
        in: query
        description: A cursor for pagination. Returns records newer than the specified object ID.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: This parameter specifies the number of records to display per page, ranging from 1 to 100
        schema:
          minimum: 1
          maximum: 100
          default: 10
          type: integer
      - name: account
        required: false
        in: query
        description: The ID of the account to filter by, formatted as [A-Z\d]{8}.
        schema:
          type: string
      - name: designation
        required: false
        in: query
        description: The ID of the designation to filter by, formatted as E[A-Z\d]{7}.
        schema:
          type: string
      responses:
        '200':
          description: On success, the API returns the list of campaigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignsResponse'
        '403':
          description: Forbidden. The API key does not have permission to access campaigns.
      security:
      - bearer: []
      summary: Get campaigns
      tags:
      - Campaigns
  /v1/campaigns/{id}:
    get:
      description: This request allows you to read your Fundraise Up campaign record. Only base campaign types are supported.
      operationId: GetCampaign
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the campaign, formatted as FUN[A-Z\d]{8}.
        schema:
          example: FUNXXXXXXXX
          type: string
      - name: livemode
        required: false
        in: query
        description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026. Campaigns only exist in live mode — set this to `true`.
        schema:
          example: true
          type: boolean
      responses:
        '200':
          description: On success, the API returns the campaign object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetailResponse'
        '403':
          description: Forbidden. The API key does not have permission to access campaigns.
        '404':
          description: Resource not found.
        '422':
          description: Campaign type not supported.
      security:
      - bearer: []
      summary: Get a campaign
      tags:
      - Campaigns
  /v1/campaigns/{id}/designations/assign:
    post:
      description: This request allows you to assign designations to a campaign. Each item is processed independently; the response reports the per-item outcome. Only base campaign types are supported.
      operationId: AssignDesignationsToCampaign
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the campaign, formatted as FUN[A-Z\d]{8}.
        schema:
          example: FUNXXXXXXXX
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDesignationsRequest'
      responses:
        '200':
          description: On success, the API returns the overall status and a per-item result array describing which designations were assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignDesignationsResponse'
        '403':
          description: Forbidden. The API key does not have permission to manage campaigns.
        '404':
          description: Resource not found.
        '422':
          description: 'Duplicated ids: The request contains duplicated ids.

            Campaign type not supported.

            Assign-mode limit exceeded: assign-mode campaigns support a maximum of 2 designations per request.

            Designation frequency conflict: in assign mode, a frequency cannot be assigned to more than one designation.'
      security:
      - bearer: []
      summary: Assign designations to a campaign
      tags:
      - Campaigns
  /v1/campaigns/{id}/designations/unassign:
    post:
      description: This request allows you to unassign designations from a campaign. Each item is processed independently; the response reports the per-item outcome. Only base campaign types are supported.
      operationId: UnassignDesignationsFromCampaign
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the campaign, formatted as FUN[A-Z\d]{8}.
        schema:
          example: FUNXXXXXXXX
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignDesignationsRequest'
      responses:
        '200':
          description: On success, the API returns the overall status and a per-item result array describing which designations were detached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignDesignationsResponse'
        '403':
          description: Forbidden. The API key does not have permission to manage campaigns.
        '404':
          description: Resource not found.
        '422':
          description: 'Duplicated ids: The request contains duplicated ids.

            Campaign type not supported.

            Last designation for frequency: at least one designation must remain for every active frequency.

            '
      security:
      - bearer: []
      summary: Unassign designations from a campaign
      tags:
      - Campaigns
components:
  schemas:
    UnassignDesignationsRequest:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 100
          description: An array of designations to unassign.
          type: array
          items:
            $ref: '#/components/schemas/UnassignDesignationItem'
        livemode:
          type: boolean
          description: Specifies whether the request is executed in live or test mode. Required for API keys created after 30th January 2026.
          example: true
      description: Contains the request parameters required for detaching designations from a campaign.
      required:
      - items
    AssignDesignationError:
      type: object
      properties:
        code:
          type: string
          enum:
          - designation_not_found
          - designation_already_attached
          - frequency_not_active
          description: Error code.
          example: designation_not_found
        message:
          type: string
          description: Error message.
          example: Designation not found.
      description: Describes the error that prevented assigning a single designation.
      required:
      - code
      - message
    CampaignsResponse:
      type: object
      properties:
        data:
          description: An array containing the campaign records, paginated by any request parameters.
          type: array
          items:
            $ref: '#/components/schemas/CampaignDetailResponse'
        has_more:
          type: boolean
          description: Indicates whether there are more records available. For `starting_after`, it shows that there is a page with older records. For `ending_before`, it indicates that there is a page with newer records.
          example: true
      description: Provides a paginated response for campaigns.
      required:
      - data
      - has_more
    CampaignDetailResponse:
      type: object
      properties:
        account:
          description: Organization account information.
          allOf:
          - $ref: '#/components/schemas/AccountResponse'
        campaign_page_url:
          type:
          - string
          - 'null'
          description: Public URL of the campaign page.
          example: https://org.fundraiseup.com/page/FUNXXXXXXXX
        code:
          type:
          - string
          - 'null'
          description: Campaign code, as set in the Dashboard.
          example: Code-1
        currency:
          type: string
          enum:
          - shp
          - eur
          - aed
